# SonarQube Scanner Configuration
# Reference: https://docs.sonarsource.com/sonarqube-community-build/analyzing-source-code/scanners/sonarscanner/

sonar.projectKey=sonarqube-agent-test
sonar.projectName=SonarQube AI Agent Test Project
sonar.projectVersion=1.0.0

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=

sonar.sourceEncoding=UTF-8
sonar.language=java

# JaCoCo coverage report path
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
