agent:
  type: "claude-code"
  # Judge role (FP triage, fix review) — harness-free judgment calls,
  # routable to a different backend/model than the fixer. Examples:
  #   judge_type: "claude-code"   judge_model: "opus"   (fixer=Sonnet, judge=Opus)
  #   judge_type: "bedrock-api"   judge_model: "global.anthropic.claude-opus-4-6"
  # Unset = same agent as the fixer.
  judge_type: ""
  judge_model: ""

  kiro:
    agent_name: "sonarqube-fixer"
    trust_all_tools: true

  claude:
    allowed_tools: "Read,Write,Edit"
    model: "sonnet"

  gemini: {}

  bedrock:
    model_id: "anthropic.claude-sonnet-4-20250514"
    region: "us-east-1"

sonarqube:
  url: "${SONAR_URL}"
  token: "${SONAR_TOKEN}"
  main_project_key: "sonarqube-agent-test"

scanner:
  ephemeral_key_pattern: "{project}-pr-{pr_number}"
  # "ephemeral": CE workaround — temp project per PR (no plugin needed)
  # "native":    sonar.pullrequest.* params (requires branch/PR plugin)
  pr_mode: "ephemeral"
  # Shell command run in project_dir before each scan (empty = skip)
  rebuild_command: >-
    docker run --rm -v "$(pwd)":/project -w /project
    maven:3.9-eclipse-temurin-17 mvn -q clean compile test-compile

# False-positive / fix-quality assessment strategy:
#   "none":   fix every issue, no screening
#   "triage": pre-fix LLM judgment; FALSE_POSITIVE → skip + report (C)
#   "review": fix-with-FP-escape + independent LLM post-review (D)
assessment:
  strategy: "triage"

modes:
  pr_premerge:
    enabled: true
    delivery: "comment"      # "comment": post via gh pr comment, "log": log only
    max_issues_per_run: 0    # 0 = unlimited
    # Push verified fixes as a new commit to the PR branch
    # (project_dir must be a git checkout of the PR branch)
    push_fix_commit: true

  post_merge:
    enabled: true
    max_issues_per_run: 0
    create_fix_pr: true
    fix_pr:
      repo: ""               # owner/repo — required when create_fix_pr: true
      base: "main"

  nightly_batch:
    enabled: true
    max_issues_per_run: 10
    severity_filter:
      - "BLOCKER"
      - "CRITICAL"
      - "MAJOR"
    create_fix_pr: true
    fix_pr:
      repo: ""               # owner/repo — required when create_fix_pr: true
      base: "main"
