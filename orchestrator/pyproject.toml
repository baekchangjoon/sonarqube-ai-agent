[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonarqube-ai-agent"
version = "0.1.1"
description = "LLM-agnostic orchestrator that auto-fixes SonarQube issues and triages false positives"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
sonar-ai-agent = "src.main:main"

[project.urls]
Homepage = "https://github.com/baekchangjoon/sonarqube-ai-agent"

# The import package is `src` (repo-internal layout kept for
# compatibility with `python -m src.main`, tests and CI). Install with
# pipx (isolated venv) to avoid any top-level name collision.
[tool.setuptools]
packages = ["src", "src.agents"]
