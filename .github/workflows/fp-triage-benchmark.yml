# FP 트리아지 벤치마크 — 수정/판정 모델 세트별 재현율·정밀도·비용 비교
#
# 세트마다 두 코퍼스를 풀파이프라인(스캔 → 판정 → 미스킵분 수정 → 재스캔
# 검증)으로 실행:
#   benchmark/fp-corpus (32이슈, 전부 GT=FP) → 재현율: 스킵 / 32
#   benchmark/tp-corpus (24이슈, 전부 GT=TP) → 오스킵(놓친 실결함): 스킵 수
#   정밀도 = fp 스킵 / (fp 스킵 + tp 스킵)
# 모델 세트:
#   sonnet-opus : 수정=Sonnet 4.6,  판정=Opus 4.6
#   haiku-sonnet: 수정=Haiku 4.5,   판정=Sonnet 4.6
#   opus-opus   : 수정=Opus 4.6,    판정=Opus 4.6
# 이상적 결과: fp에서 32 스킵·수정 0, tp에서 0 스킵·수정 24
#
# 필요: repo Variables(AWS_ROLE_ARN, AWS_REGION), Secret(SONAR_TOKEN)

name: FP Triage Benchmark

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  SONAR_URL: https://sonar.dev-temp-mail.com

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: sonnet-opus
            fixer_model: global.anthropic.claude-sonnet-4-6
            judge_model: global.anthropic.claude-opus-4-6-v1
            pr: 101
          - set: haiku-sonnet
            fixer_model: global.anthropic.claude-haiku-4-5-20251001-v1:0
            judge_model: global.anthropic.claude-sonnet-4-6
            pr: 102
          - set: opus-opus
            fixer_model: global.anthropic.claude-opus-4-6-v1
            judge_model: global.anthropic.claude-opus-4-6-v1
            pr: 103
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC -> AssumeRole)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        run: pip install -q -r orchestrator/requirements.txt

      - name: Preflight — Bedrock judge model reachable
        env:
          JUDGE_MODEL: ${{ matrix.judge_model }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        working-directory: orchestrator
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, ".")
          from src.agents.bedrock_api import BedrockAPIAgent
          agent = BedrockAPIAgent(model_id=os.environ["JUDGE_MODEL"],
                                  region=os.environ["AWS_REGION"])
          out = agent.generate_fix("Reply with the single word: pong", "/tmp")
          assert "pong" in out.lower(), f"judge model unreachable: {out!r}"
          print("judge OK:", os.environ["JUDGE_MODEL"])
          EOF

      - name: Build corpora
        run: |
          for corpus in fp-corpus tp-corpus; do
            docker run --rm -v "$GITHUB_WORKSPACE/benchmark/$corpus":/project \
              -w /project maven:3.9-eclipse-temurin-17 \
              mvn -q clean compile test-compile
          done

      - name: Write benchmark configs
        env:
          FIXER_MODEL: ${{ matrix.fixer_model }}
          JUDGE_MODEL: ${{ matrix.judge_model }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          for corpus in fp tp; do
            cat > bench-config-$corpus.yml <<EOF
          agent:
            type: "claude-code"
            judge_type: "bedrock-api"
            judge_model: "$JUDGE_MODEL"
            claude:
              allowed_tools: "Read,Write,Edit"
              model: "$FIXER_MODEL"
            bedrock:
              region: "$AWS_REGION"
          sonarqube:
            url: "$SONAR_URL"
            token: "\${SONAR_TOKEN}"
            main_project_key: "$corpus-corpus-bench"
          scanner:
            ephemeral_key_pattern: "{project}-pr-{pr_number}"
            pr_mode: "ephemeral"
            rebuild_command: >-
              docker run --rm -v "\$(pwd)":/project -w /project
              maven:3.9-eclipse-temurin-17 mvn -q clean compile test-compile
          assessment:
            strategy: "triage"
          modes:
            pr_premerge:
              enabled: true
              delivery: "log"
              max_issues_per_run: 0
              push_fix_commit: false
            post_merge:
              enabled: true
            nightly_batch:
              enabled: true
          EOF
          done

      - name: Run triage pipeline (fp-corpus, then tp-corpus)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_REGION: ${{ vars.AWS_REGION }}
          ANTHROPIC_SMALL_FAST_MODEL: global.anthropic.claude-haiku-4-5-20251001-v1:0
          BENCH_PR: ${{ matrix.pr }}
        working-directory: orchestrator
        run: |
          for corpus in fp tp; do
            python -m src.main --config ../bench-config-$corpus.yml \
              pr-premerge --repo dummy/bench --pr-number "$BENCH_PR" \
              --project-dir "$GITHUB_WORKSPACE/benchmark/$corpus-corpus" \
              --cleanup > ../result-$corpus.json 2> ../run-$corpus.log || true
            tail -40 ../run-$corpus.log
            cat ../result-$corpus.json
          done

      - name: Attach set metadata
        env:
          BENCH_SET: ${{ matrix.set }}
          FIXER_MODEL: ${{ matrix.fixer_model }}
          JUDGE_MODEL: ${{ matrix.judge_model }}
        run: |
          python - <<'EOF'
          import json, os
          merged = {
              "set": os.environ["BENCH_SET"],
              "fixer_model": os.environ["FIXER_MODEL"],
              "judge_model": os.environ["JUDGE_MODEL"],
              "fp": json.load(open("result-fp.json")),
              "tp": json.load(open("result-tp.json")),
          }
          json.dump(merged,
                    open(f"result-{os.environ['BENCH_SET']}.json", "w"),
                    indent=2)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.set }}
          path: |
            result-${{ matrix.set }}.json
            run-fp.log
            run-tp.log

  report:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true

      - name: Build comparison report
        run: |
          python .github/workflows/fp_benchmark_report.py result-*.json \
            > fp-triage-benchmark-report.md
          cat fp-triage-benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: fp-triage-benchmark-report.md
