name: CI Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: orchestrator/pyproject.toml
      - name: Install (package + dev deps)
        run: pip install -e ".[dev]"
      - name: Unit tests
        # integration tests need a live SonarQube + token and auto-skip
        # without SONAR_TOKEN; exclude them explicitly here.
        run: pytest tests/ -m "not integration" -v
