name: CI Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: orchestrator/requirements.txt
      - name: Install dependencies
        # Install deps only (not the package): the tests import `src`
        # directly via `python -m pytest`, and an editable build is not
        # needed to run them.
        run: pip install -r requirements.txt
      - name: Unit tests
        # integration tests need a live SonarQube + token and auto-skip
        # without SONAR_TOKEN; exclude them explicitly here.
        run: python -m pytest tests/ -m "not integration" -v
